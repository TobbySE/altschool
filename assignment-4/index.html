<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign up page - CSS 3</title>
        <link href="styles.css" rel="stylesheet">
</head>
<body>
    <a href="../index.html">Back to Assignments</a>
    <div class="container">
        <div class="left-section">
            <img src="assets/image.svg" alt="image">
            <h2>For Individuals</h2>
            <p>Start benefiting from the wellness experience. For companies looking on increasing productivity, and improving organization wellness.</p>
        </div>
        <div class="form-container">
        <form>
<div class="form-group-container">
    <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name">
    </div>
    <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name">
    </div>
</div>

<div class="form-group-container">
    <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender">
            <option class="placeholder" value="" disabled selected>Select here</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
        </select>
    </div>
    <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" data-placeholder="Select here" required>

    </div>
</div>

<div class="form-group-container">
    <div class="form-group">
        <label for="weight">Weight (KG)</label>
        <input type="text" id="weight" placeholder="Enter Weight">
    </div>
    <div class="form-group">
        <label for="height">Height (CM)</label>
        <input type="text" id="height" placeholder="Enter height here..">
    </div>
</div>

<div class="form-group-container">
<div class="form-group">
    <label for="gender">Activity Level</label>
    <select id="gender">
        <option class="placeholder" value="" disabled selected>Select here</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
    </select>
</div>
</div>

<div class="form-group-container">
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password">
    </div>
</div>
<div class="footer">
<button type="submit" class="register-btn">Register</button>
<p>By clicking Register, you agree to our <a href="#">Terms of Use</a> and our <a href="#">Privacy Policy</a></p>
</div>
    </form>
        </div>
    </div>
</body>
</html>
